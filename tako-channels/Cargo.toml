[package]
name = "tako-channels"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
getrandom = "0.4"
base64 = "0.23"
bytes = "1"
openssl.workspace = true
pingora-core = { version = "0.9", default-features = false, features = ["openssl"] }
pingora-proxy = { version = "0.9", default-features = false, features = ["openssl"] }
pingora-http = "0.9"
jsonschema = { version = "0.58.0", default-features = false }
parking_lot = "0.12"
percent-encoding = "2.3"
postgres = "0.19"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tako-sqlite = { path = "../tako-sqlite" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"
rusqlite.workspace = true

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tempfile = "=3.27.0"
