[package]
name = "tako-storage"
version = "0.0.0"
edition.workspace = true
publish = false

[features]
default = ["http"]
http = ["dep:futures-util", "dep:openssl", "dep:hex", "dep:http", "dep:serde_json", "dep:percent-encoding", "dep:pingora-core", "dep:pingora-proxy", "dep:pingora-http", "dep:tracing", "dep:cap-std", "dep:tempfile", "dep:libc"]

[dependencies]
tako-core = { path = "../tako-core" }
object_store = { version = "=0.14.2", default-features = false, features = ["fs", "aws"] }
futures-util = { version = "0.3", optional = true }
tokio.workspace = true
openssl = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
http = { version = "1", optional = true }
serde_json = { workspace = true, optional = true }
url = "2"
percent-encoding = { version = "2", optional = true }
pingora-core = { version = "0.9", default-features = false, features = ["openssl"], optional = true }
pingora-proxy = { version = "0.9", default-features = false, features = ["openssl"], optional = true }
pingora-http = { version = "0.9", optional = true }
tracing = { version = "0.1", optional = true }
cap-std = { version = "4.0.3", optional = true }
libc = { version = "0.2", optional = true }
sha2 = "0.11"
tempfile = { version = "=3.27.0", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
http = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
