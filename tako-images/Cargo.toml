[package]
name = "tako-images"
version = "0.0.0"
edition.workspace = true
publish = false

[features]
# Derives JSON Schemas for tako.toml sections; used by the CLI's schema tests.
schema = ["dep:schemars"]

[dependencies]
base64 = "0.23"
hmac = "0.13"
libvips = "2.3.0"
schemars = { version = "1.2", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
