[tools]
rust = "1.99"
bun = "1.4.4"
go = "1.27.3"
just = "1"
hk = "2.8.1"
cocogitto = "7.0.0"
zig = "0.16.0"
"cargo:cargo-zigbuild" = "0.24.0"

[bootstrap.packages]
"brew:lychee" = "latest"
"brew:cmake" = "latest"
"brew:openssl@3" = "latest"
"brew:pkgconf" = "latest"
"brew:meson" = "latest"
"brew:nasm" = "latest"
"apt:build-essential" = "latest"
"apt:cmake" = "latest"
"apt:libssl-dev" = "latest"
"apt:meson" = "latest"
"apt:nasm" = "latest"
"apt:ninja-build" = "latest"
"apt:pkg-config" = "latest"

[tasks.bootstrap]
description = "Install repository dependencies"
run = ["bun install --frozen-lockfile", "cargo fetch --locked", "go mod download"]

[hooks]
# Install/refresh git hooks whenever tools are installed
postinstall = "hk install --mise"
