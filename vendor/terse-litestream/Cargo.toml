[package]
name = "terse-litestream"
version = "0.2.0"
edition = "2024"
autotests = false
rust-version = "1.89"
license = "Apache-2.0"
description = "Embedded SQLite WAL capture and Litestream-compatible replication"
repository = "https://github.com/TerseAI/terse-litestream"

[package.metadata.port]
source = "https://github.com/benbjohnson/litestream"
version = "v0.5.17"
revision = "ccd326c175b583b5e82893a6078f06dcef5fba3f"

[features]
upstream-tests = []

[dependencies]
anyhow = "1"
crc = "3.3"
rusqlite = { version = "0.41", features = ["bundled"], default-features = false }
tempfile = "3"
terse-ltx = { version = "0.1.0", git = "https://github.com/TerseAI/terse-ltx", rev = "fdc27e08f09a532b8f0b8d72971de4b2772ef86b" }

[dev-dependencies]
serde_json = "1"

[workspace]

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[[test]]
name = "recovery"
path = "tests/recovery.rs"

[[test]]
name = "compatibility"
path = "tests/compatibility.rs"
required-features = ["upstream-tests"]

[[bin]]
name = "crash-fixture"
path = "tests/fixtures/crash.rs"
required-features = ["upstream-tests"]

[[test]]
name = "crashes"
path = "tests/crashes.rs"
required-features = ["upstream-tests"]
