services:
  server-ubuntu:
    privileged: true
    cgroup: private
    build:
      context: ../..
      dockerfile: e2e/docker/server/ubuntu.Dockerfile
    volumes:
      - e2e_ssh_keys:/opt/e2e/keys:ro
      - ${E2E_BIN_DIR:-.e2e-bin}:/opt/e2e/bin:ro
      - ../../scripts/install-tako-server.sh:/opt/e2e/install-server.sh:ro
      - ./server/entrypoint.sh:/usr/local/bin/tako-e2e-entrypoint.sh:ro
      - ./server/verify-compose-inputs.sh:/opt/e2e/verify-compose-inputs.sh:ro
  server-alma:
    privileged: true
    cgroup: private
    build:
      context: ../..
      dockerfile: e2e/docker/server/alma.Dockerfile
    volumes:
      - e2e_ssh_keys:/opt/e2e/keys:ro
      - ${E2E_BIN_DIR:-.e2e-bin}:/opt/e2e/bin:ro
      - ../../scripts/install-tako-server.sh:/opt/e2e/install-server.sh:ro
      - ./server/entrypoint.sh:/usr/local/bin/tako-e2e-entrypoint.sh:ro
      - ./server/verify-compose-inputs.sh:/opt/e2e/verify-compose-inputs.sh:ro
  runner:
    environment:
      TAKO_TELEMETRY: "0"
      NO_PROXY: "${NO_PROXY:-},localhost,127.0.0.1,server-ubuntu,server-alma"
      no_proxy: "${no_proxy:-},localhost,127.0.0.1,server-ubuntu,server-alma"
    build:
      context: ../..
      dockerfile: e2e/docker/runner/Dockerfile
    depends_on:
      - server-ubuntu
      - server-alma
    volumes:
      - ../..:/workspace:ro
      - ./runner/run-e2e.sh:/usr/local/bin/run-e2e.sh:ro
      - e2e_ssh_keys:/opt/e2e/keys
      - ${E2E_BIN_DIR:-.e2e-bin}:/opt/e2e/bin:ro
    working_dir: /workspace

volumes:
  e2e_ssh_keys:
