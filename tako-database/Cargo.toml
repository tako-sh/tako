[package]
name = "tako-database"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
base64 = "0.23"
bytes = "1"
fallible-iterator = "0.3"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
parking_lot = "0.13"
rusqlite = { workspace = true, features = ["hooks", "limits", "column_decltype"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
