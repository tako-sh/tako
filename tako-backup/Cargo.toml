[package]
name = "tako-backup"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
openssl.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
zeroize = "1"
bytes = "1"
memmap2 = "0.9"
futures = "0.3"
object_store = { version = "=0.14.2", default-features = false, features = ["fs", "aws"] }
# Match the server's current Cargo.lock, including its SQLite native library.
rusqlite = { version = "=0.41.0", features = ["bundled"] }
terse-litestream = { path = "../vendor/terse-litestream" }
terse-ltx = { git = "https://github.com/TerseAI/terse-ltx", rev = "fdc27e08f09a532b8f0b8d72971de4b2772ef86b" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }

[dev-dependencies]
tako-storage = { path = "../tako-storage", default-features = false }

[[bin]]
name = "terse-fixture"
path = "src/bin/fixture.rs"
test = false
