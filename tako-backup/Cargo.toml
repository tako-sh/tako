[package]
name = "tako-backup"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
openssl.workspace = true
zeroize = "1"
bytes = "1"
memmap2 = "0.9"
futures = "0.3"
object_store = { version = "=0.14.2", default-features = false, features = ["fs", "aws"] }
terse-litestream = { path = "../vendor/terse-litestream", default-features = false }
terse-ltx = { git = "https://github.com/TerseAI/terse-ltx", rev = "fdc27e08f09a532b8f0b8d72971de4b2772ef86b" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }

[dev-dependencies]
rusqlite.workspace = true
terse-litestream = { path = "../vendor/terse-litestream", features = ["wal-capture"] }
tako-storage = { path = "../tako-storage", default-features = false }
