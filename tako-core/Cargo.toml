[package]
name = "tako-core"
edition.workspace = true
publish = false

[features]
# Derives JSON Schemas for tako.toml sections; used by the CLI's schema tests.
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
