name = "demo"
runtime = "bun"
preset = "tanstack-start"
main = "dist/server/tako-entry.mjs"

[[build_stages]]
name = "sdk"
run = "bun run build"
cwd = "../../../sdk/javascript"

[[build_stages]]
name = "app"
run = "bun run build"
exclude = ["website/src/assets/**", "website/public/**"]

[envs.development]
routes = ["demo.test", "*.demo.test"]
databases = { mission = "mission" }

[envs.production]
routes = ["demo.tako.sh", "*.demo.tako.sh"]
source_ip = "direct"
